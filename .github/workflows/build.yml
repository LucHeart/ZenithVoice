name: Build

on:
  push:
    branches: ["**"]
    # plain semver tags like 1.0.0, no "v" prefix
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      mc: ${{ steps.read.outputs.mc }}
    steps:
      - uses: actions/checkout@v4
      # mc_versions in gradle.properties is the single list of MC versions to build
      - id: read
        run: |
          list=$(grep '^mc_versions=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          echo "mc=$(jq -cn --arg l "$list" '$l | split(",")')" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.mc) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -Pmc=${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: ZenithVoice-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches plugin_version
        run: |
          version=$(grep '^plugin_version=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match plugin_version=$version in gradle.properties"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
          # published by hand after checking it
          draft: true
